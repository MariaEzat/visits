
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تسجيل الدخول | سجل الافتقاد</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root {
      --brand: #236653;
      --brand-dark: #174b3f;
      --brand-soft: #eaf3ef;
      --gold: #c59a50;
      --ink: #26352f;
      --muted: #75827c;
      --page: #f3f6f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right,
          rgba(197, 154, 80, .12), transparent 27rem),
        var(--page);
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      overflow: hidden;
      border: 1px solid rgba(35, 102, 83, .08);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 15px 45px rgba(36, 65, 52, .09);
    }

    .login-header {
      position: relative;
      overflow: hidden;
      padding: 35px 25px 30px;
      text-align: center;
      color: #fff;
      background: linear-gradient(
        125deg,
        var(--brand-dark),
        var(--brand) 75%,
        #397b64
      );
    }

    .login-header::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      left: -65px;
      bottom: -115px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;
      box-shadow:
        0 0 0 20px rgba(255,255,255,.035),
        0 0 0 42px rgba(255,255,255,.025);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 17px;
      color: #f4dcae;
      font-size: 32px;
      border: 1px solid rgba(244,220,174,.5);
      border-radius: 21px;
      background: rgba(255,255,255,.09);
    }

    .login-header h2 {
      position: relative;
      z-index: 1;
      margin-bottom: 8px;
      font-size: 1.35rem;
      font-weight: 750;
    }

    .login-header p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: rgba(255,255,255,.8);
      font-size: .9rem;
    }

    .login-body {
      padding: 30px;
    }

    .welcome-title {
      margin-bottom: 7px;
      color: var(--brand-dark);
      font-size: 1.12rem;
      font-weight: 750;
    }

    .welcome-text {
      margin-bottom: 25px;
      color: var(--muted);
      font-size: .9rem;
    }

    .form-label {
      margin-bottom: 8px;
      color: #40534a;
      font-size: .9rem;
      font-weight: 650;
    }

    .form-control {
      min-height: 49px;
      padding: 11px 14px;
      border: 1px solid #dce5df;
      border-radius: 11px;
      background: #fbfcfb;
      direction: ltr;
      text-align: left;
    }

    .form-control:focus {
      border-color: #78a895;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(35,102,83,.11);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-control {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      color: #fff;
      border: none;
      border-radius: 11px;
      background: var(--brand);
      font-weight: 700;
      transition: .2s;
    }

    .login-btn:hover {
      background: var(--brand-dark);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .login-footer {
      padding: 15px 20px;
      color: var(--muted);
      border-top: 1px solid #edf1ee;
      background: #fbfcfb;
      text-align: center;
      font-size: .8rem;
    }

    .login-footer span {
      color: var(--gold);
    }

    #loginError {
      font-size: .87rem;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .login-body {
        padding: 23px 20px;
      }

      .login-header {
        padding: 30px 20px 25px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="login-card">

      <div class="login-header">

        <div class="logo">✦</div>

        <h2>سجل المتابعة والافتقاد</h2>


      </div>

      <div class="login-body">

        <h5 class="welcome-title">أهلًا بك</h5>

        <p class="welcome-text">
          سجل الدخول باستخدام الحساب المصرح له للوصول إلى سجل الزيارات.
        </p>

        <form id="loginForm">

          <div class="mb-3">

            <label for="loginEmail" class="form-label">
              البريد الإلكتروني
            </label>

            <input
              type="email"
              id="loginEmail"
              class="form-control"
              placeholder="example@email.com"
              autocomplete="username"
              required
            >

          </div>

          <div class="mb-3">

            <label for="loginPassword" class="form-label">
              كلمة المرور
            </label>

            <div class="password-wrapper">

              <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="إظهار كلمة المرور">
                👁
              </button>

            </div>

          </div>

          <div id="loginError" class="alert alert-danger d-none">
          </div>

          <button type="submit" id="loginBtn" class="login-btn">
            تسجيل الدخول
          </button>

        </form>

      </div>

      <div class="login-footer">
        <span>✦</span>
        سجل زيارات الافتقاد
        <span>✦</span>
      </div>

    </div>

  </main>

  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const togglePassword = document.getElementById("togglePassword");

    // لو المستخدم مسجل الدخول بالفعل، انتقلي للموقع
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("./index.html");
      }
    });

    // إظهار وإخفاء كلمة المرور
    togglePassword.addEventListener("click", () => {

      const isPassword = loginPassword.type === "password";

      loginPassword.type = isPassword ? "text" : "password";

      togglePassword.textContent = isPassword ? "🙈" : "👁";

    });

    // تسجيل الدخول
    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      loginError.classList.add("d-none");

      loginBtn.disabled = true;
      loginBtn.textContent = "جارٍ تسجيل الدخول...";

      try {

        await signInWithEmailAndPassword(
          auth,
          loginEmail.value.trim(),
          loginPassword.value
        );

        window.location.replace("./index.html");

      } catch (error) {

        console.error("Login Error:", error);

        let message = "حدث خطأ أثناء تسجيل الدخول. حاولي مرة أخرى.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/user-not-found" ||
          error.code === "auth/wrong-password"
        ) {
          message = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        } else if (error.code === "auth/too-many-requests") {
          message = "محاولات تسجيل الدخول كثيرة. حاولي لاحقًا.";
        } else if (error.code === "auth/invalid-email") {
          message = "البريد الإلكتروني غير صحيح.";
        } else if (error.code === "auth/network-request-failed") {
          message = "تأكدي من اتصال الإنترنت وحاولي مرة أخرى.";
        }

        loginError.textContent = message;
        loginError.classList.remove("d-none");

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";

      }

    });

  </script>

</body>
</html>
